<footer class="footer">
  <div class="shell">
    <div class="footer__top">
      <div>
        <div class="footer__mark">{{wordmark_stacked}}</div>
      </div>
      <div>
        <h3>Catalogue</h3>
        <ul>{{footer_categories}}</ul>
      </div>
      <div>
        <h3>Visit</h3>
        <ul>{{footer_address}}</ul>
      </div>
      <div>
        <h3>Elsewhere</h3>
        <ul>{{footer_contact}}
          <li><a href="{{base}}arrivals.xml">New arrivals feed</a></li>
        </ul>
      </div>
    </div>
    <div class="footer__bottom">
      <p class="footer__legal">{{legal}}
        <button class="footer__reset" type="button" data-age-reset hidden>Reset age check</button>
      </p>
      <p>&copy; {{year}} {{site_name}}</p>
    </div>
  </div>
</footer>

<a class="to-top" href="#main" data-to-top hidden>
  <span class="to-top__arrow" aria-hidden="true">&uarr;</span>
  <span class="visually-hidden">Back to the top</span>
</a>
