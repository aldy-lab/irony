<section class="section">
  <div class="shell">
    <div class="empty-state">
      <div class="mark" aria-hidden="true" style="width:min(100%,220px);margin:0 auto 2.5rem;color:var(--rule)">{{motif}}</div>
      <p class="eyebrow" style="justify-content:center">404</p>
      <h1 class="display-xl">That bottle is not on this shelf.</h1>
      <p class="lede" style="margin:2rem auto 0">The page you asked for does not exist, or it did and no longer does.</p>
      <p style="margin-top:2.5rem">
        <a class="button button--primary" href="{{base}}index.html"><span>See the catalogue</span></a>
      </p>
    </div>

    <div style="margin-top:clamp(2.5rem,6vw,4rem)">
      <p class="eyebrow">While you are here</p>
      <ul class="product-grid product-grid--four">{{suggestions}}</ul>
    </div>
  </div>
</section>
