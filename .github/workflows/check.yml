name: Build and check

# Nothing reaches the site without the build succeeding and every check
# passing. These were run by hand until now, which works right up until the
# once somebody forgets.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install playwright pillow pymupdf
          playwright install --with-deps chromium

      - name: Unit tests
        run: python3 tests/test_build.py

      - name: Build
        run: python3 build.py

      - name: The generated pages must match the committed ones
        run: |
          if ! git diff --quiet -- '*.html' sitemap.xml robots.txt; then
            echo "::error::build output differs from what is committed — run build.py and commit the result"
            git --no-pager diff --stat -- '*.html' sitemap.xml robots.txt
            exit 1
          fi

      - name: Copy and weight
        run: python3 tools/lint.py

      - name: Check
        run: python3 tools/check.py

      - name: Looks the same as approved
        run: python3 tools/visual.py

      - name: Keep the differences when it does not
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diff
          path: tests/diff/
          if-no-files-found: ignore
